plugins { id 'com.android.application' }

android {
    namespace 'org.keyvox.android'
    compileSdk 36
    defaultConfig {
        applicationId 'org.keyvox.android'
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName '0.1'
        testInstrumentationRunner 'org.keyvox.android.ime.ShellInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
